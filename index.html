<!DOCTYPE html>

<html lang="en">
<head>
 <script defer src="/_vercel/insights/script.js"></script>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>HappyTottii Games – Free Memory &amp; Puzzle Games</title>
<meta content="Train your brain and play your game with HappyTottii. Enjoy free Love Memory and HappyTottii Puzzle games." name="description"/>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#fff3f7;color:#1d1b1c;font-family:Arial,Helvetica,sans-serif}main{width:100%;max-width:1050px;min-height:100svh;margin:auto;padding:42px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.logo{display:block;width:clamp(140px,23vw,195px);height:auto;margin:0 auto 10px}.brand{font-size:clamp(24px,3vw,31px);font-weight:400;margin:0 0 34px;letter-spacing:.005em}h1{font-size:clamp(22px,3vw,32px);font-weight:500;line-height:1.4;letter-spacing:0;margin:0 0 32px;white-space:nowrap}.intro{font-size:clamp(15px,1.8vw,18px);font-weight:400;line-height:1.7;margin:0}.statement{font-size:clamp(22px,3vw,32px);font-weight:500;margin:13px 0 35px}.choose{font-size:17px;font-weight:400;margin:0 0 19px}.games{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.games a{background:#f9dfe9;border:1px solid #e8c3d1;border-radius:8px;padding:12px 23px;color:#231a20;text-decoration:none;font:15px Arial,Helvetica,sans-serif;transition:background .2s,border-color .2s}.games a:hover,.games a:focus-visible{background:#f4cfdd;border-color:#c99bad}.back{display:inline-block;margin-top:44px;font-size:13px;color:#5d5157;text-decoration:underline;text-underline-offset:4px}@media(max-width:700px){main{padding:35px 18px}h1{white-space:normal}.brand{margin-bottom:26px}.statement{margin-bottom:29px}.back{margin-top:36px}}

/* Only addition to the approved homepage: three original illustrations */
.statement-wrap,.game-wrap{position:relative}
.statement-wrap .statement{margin-top:13px;margin-bottom:35px}
.dec{position:absolute;display:block;object-fit:contain;height:auto;pointer-events:none;z-index:0}
.computer{width:105px;left:calc(100% + 35px);top:-22px;transform:rotate(-4deg)}
.windmill{width:112px;left:calc(100% + 42px);top:-37px;transform:rotate(4deg)}
.back-wrap{position:relative;display:inline-block}.trash{width:78px;left:calc(100% + 14px);top:12px;transform:rotate(-4deg)}
@media(max-width:760px){
 .computer{width:65px;left:auto;right:-72px;top:-6px}
 .windmill{width:68px;left:calc(100% + 5px);top:-18px}
 .trash{width:55px;left:calc(100% + 10px);top:12px}
 .statement-wrap{max-width:calc(100% - 100px)}
 .game-wrap{max-width:calc(100% - 95px)}
 main{padding-bottom:95px}
}
@media(max-width:430px){
 .computer{width:52px;right:-55px;top:2px}
 .windmill{width:54px;left:calc(100% + 4px);top:-12px}
 .trash{width:45px;left:calc(100% + 6px);top:13px}
 .statement-wrap{max-width:calc(100% - 68px)}
 .game-wrap{max-width:calc(100% - 66px)}
}

/* Compact game selection cards */
.games{gap:16px;align-items:stretch}
.games a.game-card{width:154px;min-height:158px;padding:12px 11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:12px}
.game-art{width:112px;height:102px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#fff8fb;overflow:hidden}
.puzzle-art img{display:block;width:100%;height:100%;object-fit:contain}
.memory-art{gap:5px}
.memory-art span{display:grid;place-items:center;width:48px;height:62px;border-radius:8px;background:#f8e4ee;border:1px solid #edc8d9;font-size:27px}
.game-name{font-size:15px;color:#231a20}
@media(max-width:430px){.games{gap:9px}.games a.game-card{width:128px;min-height:143px;padding:9px 7px}.game-art{width:104px;height:91px}.memory-art span{width:43px;height:56px;font-size:24px}}

/* Quadratische Spiele-Kacheln wie in App-Übersichten */
.games a.game-card{width:172px;height:172px;min-height:0;aspect-ratio:1;padding:11px;gap:8px}
.game-art{width:125px;height:125px;aspect-ratio:1;flex:0 0 auto}
.puzzle-art img{width:100%;height:100%;object-fit:cover}
.memory-art{gap:5px;padding:5px}
.memory-art .memory-tile{width:calc(50% - 3px);height:100%;min-width:0;display:grid;place-items:center;border:1px solid #edc8d9;background:#fff8fb;border-radius:7px;overflow:hidden}
.memory-art .memory-tile img{width:100%;height:100%;object-fit:contain}
.game-name{font-size:14px;line-height:1.1}
@media(max-width:430px){.games a.game-card{width:145px;height:145px;min-height:0;padding:8px;gap:5px}.game-art{width:108px;height:108px}.memory-art .memory-tile{height:100%;width:calc(50% - 3px)}}

/* Responsive safety: prevent clipped content on tablets and phones. */
html,body{width:100%;max-width:100%;overflow-x:clip}
main{min-width:0;max-width:100%;overflow-wrap:break-word}
.statement-wrap,.game-wrap{min-width:0;max-width:100%}
.games{width:100%;max-width:100%;min-width:0}
.games a.game-card{flex:0 1 172px;max-width:100%;aspect-ratio:1;height:auto;min-height:0}
.game-art{max-width:100%;max-height:calc(100% - 26px)}
.puzzle-art img{object-fit:contain}
@media(max-width:760px){
  .statement-wrap,.game-wrap{max-width:100%}
  .dec{display:none}
  main{padding:28px 16px 48px}
  h1{white-space:normal;overflow-wrap:anywhere}
}
@media(max-width:390px){
  main{padding:22px 10px 40px}
  .games{gap:8px}
  .games a.game-card{flex:0 1 min(145px,calc((100vw - 36px)/2));width:min(145px,calc((100vw - 36px)/2));padding:7px;gap:5px}
  .game-art{width:100%;height:auto;aspect-ratio:1;min-height:0;flex:0 1 auto}
  .game-name{font-size:12px}
}
@media(max-width:300px){.games a.game-card{flex-basis:min(172px,100%);width:min(172px,100%)}}
</style>
